name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (core + app)
        run: swift build
      - name: Test
        run: swift test
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev zip unzip
      - run: swift test
